packages:
  - "apps/*"
  - "packages/*"
# Нативная сборка этому пакету не нужна: он тянется как зависимость правил
# линтера и в приложение не попадает. Без явного ответа pnpm 11 роняет install,
# а вместе с ним и сборку на EAS
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-build-properties@57.0.17
  - expo-location@57.0.16
  - expo-notifications@57.0.17
  - expo-router@57.0.19
