packages:
  - "apps/*"
  - "packages/*"
# Кому из зависимостей разрешено выполнять свои установочные скрипты. Без
# явного ответа pnpm 11 роняет установку, а с ней и сборку на EAS
allowBuilds:
  # Скачивает готовые нативные библиотеки графики — без этого Skia не соберётся
  '@shopify/react-native-skia': true
  # Нативная сборка не нужна: пакет приходит зависимостью правил линтера
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-build-properties@57.0.17
  - expo-location@57.0.16
  - expo-notifications@57.0.17
  - expo-router@57.0.19
