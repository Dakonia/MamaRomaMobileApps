[project]
name = "mamaroma-api"
version = "0.1.0"
description = "Backend API для мультитенантного приложения сети ресторанов"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.2.12",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=6.5.0",
    "structlog>=25.5.0",
    "bcrypt>=5.0.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "types-python-jose>=3.5.0.20260408",
    "fonttools>=4.63.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Определения таблиц Alembic генерирует одной строкой — переносить их вручную незачем
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
