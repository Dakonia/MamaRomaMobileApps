name: Плагин iikoFront

# Плагин собирается при каждой правке своих файлов. Windows не нужен:
# проект целится в net472, а эталонные сборки приходят пакетом из NuGet.
on:
  push:
    paths:
      - "iiko_front_bridge/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "iiko_front_bridge/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Собрать
        working-directory: iiko_front_bridge/src/Reservly.IikoFrontBridge
        run: dotnet build -c Release --nologo

      - name: Сложить то, что ставится на терминал
        working-directory: iiko_front_bridge
        run: |
          mkdir -p artifact
          cp src/Reservly.IikoFrontBridge/bin/Release/net472/Reservly.IikoFrontBridge.dll artifact/
          cp src/Reservly.IikoFrontBridge/Manifest.xml artifact/
          cp example.settings.json artifact/bridge.settings.json
          cp tools/install-from-artifact.ps1 artifact/

      # Готовый архив можно скачать со страницы запуска и поставить
      # на терминал, не собирая ничего на Windows
      - uses: actions/upload-artifact@v4
        with:
          name: iiko-front-bridge
          path: iiko_front_bridge/artifact/
          retention-days: 30
